[build]
  command = "node inject-env.js"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # SUPABASE_URL and SUPABASE_ANON_KEY are DESIGNED to be public — they ship
  # in config.js for the browser to talk to Supabase directly. Security comes
  # from RLS policies (see supabase_auth_migration.sql), not from hiding this
  # key. Telling Netlify's secrets scanner to ignore just these two prevents
  # false-positive build failures without weakening the scan for anything
  # that actually must stay secret: SUPABASE_SERVICE_ROLE_KEY and
  # GEMINI_API_KEY are deliberately NOT listed here, so the build will still
  # fail loudly if either of those ever ends up in a client-facing file.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

# `publish = "."` means every tracked file in the repo root is served
# statically, including internal-only files that were never meant to be
# public: the *.sql migration/schema files (full table layout + exact RLS
# policy design) and the *.md/*.txt audit and design docs (narrate past
# vulnerabilities, in-progress fixes, and calculation internals in prose).
# The catch-all SPA rewrite below does NOT shadow these — Netlify serves an
# existing file over a redirect unless the rule is `force`d — so each of
# these needs its own forced rule, evaluated first (redirects apply in
# file order, first match wins), to 404 them instead.
[[redirects]]
  from = "/*.sql"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/*.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/*.txt"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
